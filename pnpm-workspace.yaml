packages:
  - packages/*
  - examples
  - compat

# A version is installed only when it has been on the registry for 3 days (in minutes), which STANDARDS.md asks of every
# dependency. pnpm checks the lock file against it on every install.
minimumReleaseAge: 4320

allowBuilds:
  esbuild: false
  lefthook: false
  workerd: false
