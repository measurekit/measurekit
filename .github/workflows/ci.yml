name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a branch or a pull request cancels the run in progress: it holds the commits of the older run, and every run
# checks the whole repository.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:standards
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm check:packages
      - run: pnpm check:release
      # Packs the packages, installs them into a scratch project, imports every subpath in Node.js and type-checks them.
      - run: pnpm check:tarballs
      - run: pnpm check:licenses
      - run: pnpm check:audit
      - run: pnpm docs:api
      # Version and Dependabot pull requests change package files without a changeset of their own.
      - if: >-
          github.event_name == 'pull_request' &&
          !startsWith(github.head_ref, 'changeset-release/') &&
          github.actor != 'dependabot[bot]'
        run: pnpm changeset status --since=origin/main

  # The tests of each package, of the scripts that check the repository and of the examples, on each supported Node.js major.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [core, psychometrics, knowledge-tracing, scripts, examples]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.node != 22 || !contains(fromJSON('["core", "knowledge-tracing"]'), matrix.project)
        run: pnpm test --project ${{ matrix.project }}
      # On the oldest supported Node.js a package's tests also check its coverage floor (vitest.config.ts), on its files
      # alone. Psychometrics' floor takes 36 minutes, so rules.yml checks it each week and at a release: per-push CI stays
      # short, as Actions minutes are limited.
      - if: matrix.node == 22 && contains(fromJSON('["core", "knowledge-tracing"]'), matrix.project)
        run: pnpm test --project ${{ matrix.project }} --coverage --coverage.include='packages/${{ matrix.project }}/src/**'

  # The benchmarks of the packages, on seeded data. The job fails when the fastest sample of a benchmark is above its budget
  # (docs/performance.md).
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bench
