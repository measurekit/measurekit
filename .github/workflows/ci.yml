name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm check:packages
      - run: pnpm docs:api
      # Version and Dependabot pull requests change package files without a changeset of their own.
      - if: >-
          github.event_name == 'pull_request' &&
          !startsWith(github.head_ref, 'changeset-release/') &&
          github.actor != 'dependabot[bot]'
        run: pnpm changeset status --since=origin/main

  # The tests of each package, on each supported Node.js major.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [core, psychometrics, knowledge-tracing]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --project ${{ matrix.package }}
