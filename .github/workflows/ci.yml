name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a branch or a pull request cancels the run in progress: it holds the commits of the older run, and `changes`
# compares with the last run that passed, so what the cancelled run did not check is checked by the newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job has a `timeout-minutes` of about three times its last green run, and at least 10 for a job that downloads, so that a
# hung job stops and does not run to the 360 minutes of GitHub, which the Actions minutes of the month cannot bear. A benchmark
# ends within half its timeout (STANDARDS.md section 7). `runtimes` has not run on GitHub yet, so its limit is a guess to lower
# after its first green run.
jobs:
  # What a push or a pull request changed since the last commit of main whose run passed, or since the base of a pull request,
  # and so which jobs have something to check. A job that is skipped passes a required check. When nothing can be compared, for
  # instance when no run has passed yet, every job runs. A job runs when a member of the workspace that it reads, or a member
  # that uses that one, changed (core, psychometrics, knowledge-tracing, the examples and compat, with their dependencies read
  # from their package.json files); the lock file, the root configuration, the scripts that the benchmarks share and this
  # workflow reach every job; the other Markdown, the configuration of the linters and the plugin of the docs site reach none but
  # check. A file that no rule
  # names reaches every job. The guides of a package and the README are tests of the examples alone, the runner of their
  # samples is a test of the examples and of the scripts, and AGENTS.md, the changesets, the manifests and the other workflows
  # are tests of the scripts alone. A package that changed also reaches the tests of the scripts, which bundle its entry
  # points. Outputs: projects is the JSON array of the Vitest projects whose tests run, one matrix leg each on each Node.js;
  # bench and runtimes say whether the job runs. The rules job is in rules.yml.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      projects: ${{ steps.filter.outputs.projects }}
      bench: ${{ steps.filter.outputs.bench }}
      runtimes: ${{ steps.filter.outputs.runtimes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PULL_BASE: ${{ github.event.pull_request.base.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            BASE="$PULL_BASE"
          else
            BASE=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=$BRANCH&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty') || BASE=""
          fi
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE=""
          export BASE
          node - <<'EOF'
          const { execFileSync } = require("node:child_process");
          const { appendFileSync, readFileSync, readdirSync } = require("node:fs");

          const git = (...args) => execFileSync("git", args, { encoding: "utf8", maxBuffer: 1 << 27 });

          // The workspace: its packages, the examples and compat, each with the workspace packages it uses.
          const members = new Map();
          const names = new Map();
          const packages = readdirSync("packages", { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .map((entry) => `packages/${entry.name}`);
          for (const dir of [...packages, "examples", "compat"]) {
            const manifest = JSON.parse(readFileSync(`${dir}/package.json`, "utf8"));
            members.set(dir, manifest);
            names.set(manifest.name, dir);
          }
          const usedBy = (dir) => {
            const { dependencies, devDependencies, peerDependencies } = members.get(dir);
            return Object.keys({ ...dependencies, ...devDependencies, ...peerDependencies })
              .filter((name) => names.has(name))
              .map((name) => names.get(name));
          };
          // The Vitest project of a member: a package by its folder, the examples by theirs. Compat has none.
          const project = (dir) => dir.replace(/^packages\//, "");

          // What changed. Null when there is nothing to compare with: everything is then checked.
          let changed = null;
          if (process.env.BASE) {
            try {
              changed = git("diff", "--name-only", "--no-renames", process.env.BASE, "HEAD").split("\n").filter(Boolean);
            } catch {
              changed = null;
            }
          }

          // A change to these reaches no job but check (and a test of scripts, for what SCRIPT_TESTED names), which builds the docs
          // site with the plugin and the files at the top of docs/.
          const NOT_CHECKED =
            /^(\.changeset\/|\.github\/(?!workflows\/ci\.yml$)|[^/]+\.md$|LICENSE$|biome\.json$|biome\/|cspell\.json$|knip\.json$|typedoc\.json$|lefthook\.yml$|\.editorconfig$|docs\/([^/]+|[^/]+\/performance\.md)$|validation\/(?!benchmarks\/))/;
          // The scripts that only check, or are checked by the tests of scripts, with the identity of the family, which check reads.
          // Every other script, bench-harness.ts, serves the tests and the benchmarks of the packages.
          const OWN_SCRIPTS =
            /^scripts\/(test\/|check-standards\.ts$|check-identity\.ts$|family\.ts$|identity\.ts$|check-duplication\.ts$|check-licenses\.ts$|check-rules\.ts$|check-release\.ts$|check-tarballs\.ts$|entry-sizes\.ts$|size-budgets\.ts$|peak-memory\.ts$|prepare\.ts$)/;

          // The runner of the samples and the comparison of their results, which the examples run and the tests of scripts check.
          const SAMPLE_SCRIPTS = /^scripts\/(guide-samples|stated-values)\.ts$/;

          // The files that a test of scripts reads besides the scripts: AGENTS.md, whose table of repeats it compares with the
          // code, the changesets and every manifest, which it holds to the packages released and to exact versions, and the
          // workflows, whose jobs it holds to a timeout and whose release it holds to the mutation rules.
          const SCRIPT_TESTED = /^(AGENTS\.md|\.changeset\/.+|(.+\/)?package\.json|\.github\/workflows\/[^/]+\.yml)$/;

          let everything = changed === null;
          let scriptTests = false;
          let guides = false;
          let benchmarks = false;
          const touched = new Set();
          for (const file of changed ?? []) {
            const [top, name, third] = file.split("/");
            if (SCRIPT_TESTED.test(file)) scriptTests = true;
            if (top === "packages" && members.has(`packages/${name}`)) touched.add(`packages/${name}`);
            else if ((top === "examples" || top === "compat") && members.has(top)) touched.add(top);
            else if (top === "docs" && third !== undefined && third !== "performance.md" && members.has(`packages/${name}`))
              guides = true;
            else if (file === "README.md") guides = true;
            else if (top === "validation" && name === "benchmarks") benchmarks = true;
            else if (SAMPLE_SCRIPTS.test(file)) guides = scriptTests = true;
            else if (OWN_SCRIPTS.test(file)) scriptTests = true;
            else if (!NOT_CHECKED.test(file)) everything = true;
          }

          // The members that the change reaches: those it touched, and the members that use them, however far.
          const reached = new Set(everything ? members.keys() : touched);
          for (let grew = true; grew; ) {
            grew = false;
            for (const dir of members.keys()) {
              if (!reached.has(dir) && usedBy(dir).some((used) => reached.has(used))) {
                reached.add(dir);
                grew = true;
              }
            }
          }
          const reachedPackages = packages.filter((dir) => reached.has(dir));

          // The Vitest projects of the tests: the packages and the examples that the change reaches, and the scripts.
          const projects = new Set([...reached].filter((dir) => dir !== "compat").map(project));
          if (guides) projects.add("examples");
          if (everything || scriptTests || reachedPackages.length > 0) projects.add("scripts");

          const outputs = {
            projects: JSON.stringify([...projects]),
            bench: everything || benchmarks || reachedPackages.some((dir) => members.get(dir).scripts?.bench),
            runtimes: everything || reached.has("compat"),
          };
          for (const [name, value] of Object.entries(outputs)) {
            console.log(`${name}=${value}`);
            if (process.env.GITHUB_OUTPUT) appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
          }
          EOF

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:standards
      - run: pnpm check:duplication
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm check:packages
      - run: pnpm check:release
      # Packs the packages, installs them into a scratch project, imports every subpath in Node.js and type-checks them.
      - run: pnpm check:tarballs
      - run: pnpm check:licenses
      - run: pnpm check:audit
      - run: pnpm docs:api
      # Version and Dependabot pull requests change package files without a changeset of their own.
      - if: >-
          github.event_name == 'pull_request' &&
          !startsWith(github.head_ref, 'changeset-release/') &&
          github.actor != 'dependabot[bot]'
        run: pnpm changeset status --since=origin/main

  # The tests of each package, of the scripts that check the repository and of the examples that the change reaches, on each
  # supported Node.js major. Psychometrics' take 27 minutes, the other projects 3 at most.
  test:
    needs: changes
    if: needs.changes.outputs.projects != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.project == 'psychometrics' && 80 || 10 }}
    strategy:
      matrix:
        project: ${{ fromJSON(needs.changes.outputs.projects) }}
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.node != 22 || !contains(fromJSON('["core", "knowledge-tracing"]'), matrix.project)
        run: pnpm test --project ${{ matrix.project }}
      # On the oldest supported Node.js a package's tests also check its coverage floor (vitest.config.ts), on its files
      # alone. Psychometrics' floor takes 36 minutes, so rules.yml checks it each week and at a release: per-push CI stays
      # short, as Actions minutes are limited.
      - if: matrix.node == 22 && contains(fromJSON('["core", "knowledge-tracing"]'), matrix.project)
        run: pnpm test --project ${{ matrix.project }} --coverage --coverage.include='packages/${{ matrix.project }}/src/**'

  # The benchmarks of the packages, on seeded data. The job fails when the fastest sample of a benchmark is above its budget
  # (docs/<package>/performance.md). Its last green run took 13 minutes, within a third of its limit.
  bench:
    needs: changes
    if: needs.changes.outputs.bench == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bench

  # The calibration and the knowledge tracing fit, built as the packages ship, on Node.js, Deno, Bun and workerd (compat/README.md).
  runtimes:
    needs: changes
    if: needs.changes.outputs.runtimes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm compat:runtimes
