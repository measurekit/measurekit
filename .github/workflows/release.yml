name: Release

on: workflow_dispatch

concurrency: ${{ github.workflow }}-${{ github.ref }}

# npm trusted publishing: the id token authenticates the publish and adds provenance, so no npm token is stored.
permissions:
  contents: write
  id-token: write

jobs:
  # The release gate's slow checks: the mutation rules and the coverage floor of psychometrics, which no push runs.
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/rules.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm release
