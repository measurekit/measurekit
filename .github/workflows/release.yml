name: Release

on: workflow_dispatch

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Every version carries provenance. The first version of a package is published with the short-lived token of the secret
# NPM_TOKEN and NPM_CONFIG_PROVENANCE, since a trusted publisher is configured only on a package that exists; once each package
# has its trusted publisher, the id token authenticates the publish and adds provenance, and the secret is deleted.
permissions:
  contents: write
  id-token: write

jobs:
  # The release gate's slow checks: the mutation rules and the coverage floor of psychometrics, which no push runs.
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/rules.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: pnpm release
      # One GitHub release for the run, named by its date, with the versions published and their changelog entries, which
      # Zenodo archives; a run that published nothing creates none.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github-release.ts
