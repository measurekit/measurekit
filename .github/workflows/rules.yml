name: Rules

# The slow checks, which do not run on a push, as per-push CI stays short while Actions minutes are limited. `rules`
# removes each rule that scripts/check-rules.ts lists from a copy of the code, and fails when its test still passes;
# `coverage` runs the tests of psychometrics under coverage, 36 minutes, and fails below its floor in vitest.config.ts.
# A builder runs the rules of its package before a merge, with `pnpm check:rules packages/<package>`, and this workflow
# runs both each Monday, on "Run workflow", and from release.yml, which publishes only when both pass.
on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Called from release.yml, github.workflow is the caller's name: the suffix keeps the two groups apart.
concurrency:
  group: ${{ github.workflow }}-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    runs-on: ubuntu-latest
    # No run has finished yet: lower this to three times the first green run.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:rules

  coverage:
    runs-on: ubuntu-latest
    # Its tests take 27 minutes on a runner without coverage and about 4.6 times as long with it, and no run has finished yet:
    # lower this to three times the first green run.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --project psychometrics --coverage --coverage.include='packages/psychometrics/src/**'
