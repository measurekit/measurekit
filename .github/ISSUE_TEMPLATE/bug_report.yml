name: Bug report
description: Report a result or behavior of a measurekit package that is wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Report vulnerabilities privately, as the [security policy](https://github.com/measurekit/measurekit/security/policy)
        describes, not here.
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@measurekit/psychometrics"
        - "@measurekit/knowledge-tracing"
        - "@measurekit/core"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version from `npm ls @measurekit/psychometrics`, `npm ls @measurekit/knowledge-tracing` or `npm ls @measurekit/core`, or the commit if you build from source.
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Node.js
        - Deno
        - Other
    validations:
      required: true
  - type: input
    id: runtime-version
    attributes:
      label: Runtime version
      description: The output of `node --version` or `deno --version`.
      placeholder: v22.18.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest code and data that show the problem, so that it runs as pasted.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected, with the reference value or the formula if the result is numeric.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead, with the full error message if there is one.
    validations:
      required: true
